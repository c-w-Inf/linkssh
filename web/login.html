<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password required</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
     font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
     background:#0b0d1210}
.card{width:min(360px,100%);padding:22px;border-radius:12px;background:Canvas;color:CanvasText;
      border:1px solid #8884;box-shadow:0 18px 50px #0005}
h1{font-size:15px;margin:0 0 4px}
.path{margin:0 0 14px;font-size:12px;opacity:.6;word-break:break-all}
input{width:100%;padding:8px 10px;border:1px solid #8886;border-radius:8px;background:transparent;
      color:inherit;font:inherit}
input:focus{outline:2px solid #4c8dff66;border-color:#4c8dff99}
button{margin-top:12px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:#3b82f6;
       color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#2f74e0}
.err{display:none;margin:10px 0 0;color:#e5484d;font-size:12px}
.err.show{display:block}
</style>
</head>
<body>
<form class="card" id="f">
  <h1>Password required</h1>
  <p class="path">{{PATH}}</p>
  <input id="p" type="password" name="pass" placeholder="access password" autocomplete="current-password" autofocus required>
  <button type="submit">Unlock</button>
  <p class="err" id="e">wrong password, try again</p>
</form>
<script>
(function () {
  var form = document.getElementById('f'), input = document.getElementById('p'),
      err = document.getElementById('e'), KEY = 'linkssh.try';
  try {
    var at = +sessionStorage.getItem(KEY) || 0;
    if (at && Date.now() - at < 15000) err.classList.add('show');
    sessionStorage.removeItem(KEY);
  } catch (e) {}
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) {}
    document.cookie = 'pass=' + encodeURIComponent(input.value) +
                      '; Path=/; SameSite=Lax; Max-Age=2592000';
    location.reload();
  });
})();
</script>
</body>
</html>
